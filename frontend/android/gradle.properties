# Tuned for 8GB host machines (Metaspace bump after D8 OOM)
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Avoid Kotlin incremental cache crash when project (D:) and pub-cache (C:) differ
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
org.gradle.parallel=false
org.gradle.daemon=true
org.gradle.workers.max=2
