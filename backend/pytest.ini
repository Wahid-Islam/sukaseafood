[pytest]
testpaths = tests

# Put the backend directory on sys.path so `from app...` resolves.
#
# Without this, bare `pytest` fails with ModuleNotFoundError while
# `python -m pytest` succeeds — the -m form adds the working directory to
# sys.path, the console script does not. CI runs the bare form, so relying on
# the difference means tests pass locally and fail in CI.
pythonpath = .

addopts = -q
filterwarnings =
    ignore::DeprecationWarning
