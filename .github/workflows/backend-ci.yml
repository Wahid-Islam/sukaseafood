name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # The suite runs against real PostgreSQL. Substituting SQLite would let CI
    # pass on a schema production cannot accept — enums, JSONB and expression
    # indexes all behave differently or not at all.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sukaseafood
          POSTGRES_PASSWORD: sukaseafood
          POSTGRES_DB: sukaseafood_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://sukaseafood:sukaseafood@localhost:5432/sukaseafood_test
      TEST_DATABASE_URL: postgresql+asyncpg://sukaseafood:sukaseafood@localhost:5432/sukaseafood_test
      FIREBASE_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Import check
        run: python -c "from app.main import app; print(app.title)"

      - name: Apply migrations
        run: alembic upgrade head

      - name: Migration round-trip
        # A downgrade that does not fully clean up leaves the next fresh deploy
        # broken, so prove it before merging.
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Load reference seed
        run: python -c "import asyncio; from app.seed import apply_seed; asyncio.run(apply_seed())"

      - name: Verify schema and seed
        run: |
          PGPASSWORD=sukaseafood psql -h localhost -U sukaseafood -d sukaseafood_test \
            -v ON_ERROR_STOP=1 -f db/verify.sql

      - name: Pytest
        run: pytest -q
