name: Deploy Firebase Hosting

# Manual deploy of the Flutter web build to sukaseafood-654b7 Hosting.
# Requires repo secret FIREBASE_TOKEN from `firebase login:ci`.

on:
  workflow_dispatch:

jobs:
  hosting:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pub get
        run: flutter pub get
      - name: Build web
        run: flutter build web --release
      - name: Install Firebase CLI
        working-directory: .
        run: npm install -g firebase-tools
      - name: Deploy Hosting
        working-directory: .
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "Missing FIREBASE_TOKEN secret. Create one with: firebase login:ci"
            exit 1
          fi
          firebase deploy --only hosting --project sukaseafood-654b7 --non-interactive
