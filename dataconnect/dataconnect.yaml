specVersion: "v1"
serviceId: "sukaseafood-654b7-service"
location: "us-east4"
schemas:
  - source: "./schema"
    datasource:
      postgresql:
        database: "sukaseafood-654b7-database"
        cloudSql:
          instanceId: "sukaseafood-654b7-instance"
          # SQL DDL in backend/db/schema is the source of truth for V3.
          # COMPATIBLE lets Firebase expose that schema without rewriting it.
          schemaValidation: "COMPATIBLE"
connectorDirs: ["./example"]
